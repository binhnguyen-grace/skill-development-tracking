    --bronze: #BF6B21;    /* Yellow 2 */

  /* Header */

  .lang { display: flex; border: 1px solid rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; flex: none; }

  main.wrap { padding-top: 24px; padding-bottom: 48px; }

  /* KPI */

  /* Podium */

  .place { border-radius: var(--radius); padding: 18px 16px; text-align: center; background: var(--cream); position: relative; }
  .place.r1 { order: 2; padding-top: 30px; padding-bottom: 30px; background: var(--cyan); color: #fff; }
  .place.r2 { order: 1; background: var(--cyan-soft); color: var(--navy); }
  .crown { font-size: 30px; line-height: 1; margin-bottom: 4px; }
  .place.r3 { order: 3; }
  .medal { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; font-size: 22px; font-weight: 700; }
  .r1 .medal { background: var(--gold); color: var(--navy); width: 60px; height: 60px; font-size: 28px; }
  .r2 .medal { background: #fff; color: var(--navy); }
  .r3 .medal { background: var(--bronze); color: #fff; }
  .place .rname { font-size: 20px; font-weight: 400; line-height: 1.2; word-break: break-word; }

  .place .rstat { font-size: 13px; margin-top: 6px; opacity: .85; }
  .place.empty { opacity: .45; }
  .waiting { text-align: center; padding: 34px 16px; background: var(--cream); border-radius: var(--radius); }
  .waiting img { width: 72px; opacity: .9; }
  .waiting h3 { font-size: 22px; margin: 10px 0 4px; }

  /* Chart */
  .chart-tools { display: flex; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: none; font: inherit; font-size: 12px; padding: 5px 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--navy); color: var(--cream); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .bars { position: relative; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 32%) 1fr 92px; align-items: center; gap: 10px; padding: 3px 0; border-radius: 6px; cursor: default; }
  .bar-row:hover { background: var(--cream); }
  .bar-name { font-size: 13px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { position: relative; height: 16px; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-fill.full { background: var(--teal); }
  .bar-val { font-size: 13px; white-space: nowrap; }
  .bar-val b { font-weight: 600; }
  .bar-val span { color: var(--muted); font-size: 12px; }
  .tip { position: fixed; z-index: 10; pointer-events: none; background: var(--navy); color: var(--cream); font-size: 12px; padding: 8px 10px; border-radius: 8px; max-width: 260px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.18); }

  /* Detail */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }

  select, input[type=search] { font: inherit; font-size: 14px; color: var(--ink); padding: 9px 10px; border: 1px solid var(--sand); border-radius: 10px; background: #fff; width: 100%; }
  .filters .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 2 1 280px; }
  .ms { position: relative; }
  .ms summary { list-style: none; cursor: pointer; font-size: 14px; color: var(--ink); padding: 9px 32px 9px 10px; border: 1px solid var(--sand); border-radius: 10px; background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }

  .ms-panel { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); min-width: 260px; background: #fff; border: 1px solid var(--sand); border-radius: 12px; box-shadow: 0 8px 24px rgba(36,46,82,.15); padding: 10px; color: var(--ink); }

  .warn-list { margin-top: 10px; max-height: 320px; overflow: auto; }
  .code-list { font-size: 13px; line-height: 1.7; word-break: break-word; }

  .loading { text-align: center; padding: 80px 16px; color: var(--muted); }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 32px; }

  @media (max-width: 720px) {

  try { lang = localStorage.getItem('lc_lang') || 'vi'; } catch (e) {}
  var DATA = null;
  var chartSort = 'pct';
  var detailCache = {};
  var detailState = { selected: [], course: '', status: '', q: '' };

  function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.vi[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtDate(ms, withTime) {
    if (!ms) return '';
    var o = { timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric' };
    if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; o.hour12 = false; }
    return new Date(ms).toLocaleString(lang === 'vi' ? 'vi-VN' : 'en-GB', o);
  }
  function fmtPct(p) { return (Math.round(p * 10) / 10).toLocaleString(lang === 'vi' ? 'vi-VN' : 'en-GB') + '%'; }
  function stLabel(s) { return (I18N[lang].stMap && I18N[lang].stMap[s]) || s; }
  function courseName(id) {
    var c = (DATA.courses || []).filter(function (x) { return x.id === id; })[0];
    return c ? c.name : id;
  }
  // Bỏ tiền tố "Pizza 4P's" trong biểu đồ cho gọn
  function shortName(n) { return String(n).replace(/^\s*pizza\s*4\s*p['’]?s\s*[-–·:]?\s*/i, '') || n; }
  function restByName(n) { return DATA.restaurants.filter(function (x) { return x.name === n; })[0]; }
  function hasCounts(r) { return r && r.total != null; }

  /* ---------- render ---------- */
  function render() {
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === lang); });
    document.getElementById('footer').textContent = t('footer');
    if (!DATA) { document.getElementById('loading').textContent = t('loading'); return; }

    var d = DATA;
    document.getElementById('title').textContent = d.campaign.name || 'Learning Champion';
    var meta = [];
    if (d.campaign.start) meta.push('<span>' + t('from') + ': <b class="num">' + fmtDate(d.campaign.start) + '</b></span>');
    if (d.campaign.expectedEnd) meta.push('<span>' + t('end') + ': <b class="num">' + fmtDate(d.campaign.expectedEnd) + '</b></span>');
    meta.push('<span class="pill num">' + t('updated') + ' ' + fmtDate(d.generatedAt, true) + '</span>');
    if (d.frozen) meta.push('<span class="pill frozen">🔒 ' + t('frozen') + (d.frozenAt ? ' · ' + fmtDate(d.frozenAt, true) : '') + '</span>');
    document.getElementById('meta').innerHTML = meta.join('');

    var html = '';
    if (d.totals) html += renderKpis(d);
    html += renderBoard(d);
    html += renderChart(d);
    html += renderDetailShell(d);
    if (d.viewer.isAdmin) html += renderAdmin(d);
    document.getElementById('app').innerHTML = html;
    bindChart();
    bindDetail();
    bindAdmin();
  }

  function renderKpis(d) {
    var rate = d.totals.employees ? d.totals.completed / d.totals.employees * 100 : 0;
    var areas = (d.areas || []).map(function (a) {
      return '<div class="area-row"><span>' + esc(a.name) + '</span><div class="trk"><div class="fill" style="width:' + Math.min(100, a.pct) + '%"></div></div><span class="pv num">' + fmtPct(a.pct) + '</span></div>';
    }).join('');
    return '<div class="kpis">' +
      '<div class="kpi"><div class="v num">' + d.totals.fullRestaurants + '<span style="font-size:.55em;opacity:.6"> / ' + d.totals.restaurants + '</span></div><div class="l">' + t('kpiFull') + '</div></div>' +
      '<div class="kpi"><div class="v num">' + fmtPct(rate) + '</div><div class="l">' + t('kpiRate') + '</div></div>' +
      '<div class="kpi kpi-area"><div class="l" style="margin-bottom:6px">' + t('kpiArea') + '</div><div class="area-rows">' + (areas || '<span class="sub">—</span>') + '</div></div>' +
      '</div>';
  }

  function renderBoard(d) {
    var head = '<div class="sec-head"><div><h2>🏆 ' + t('boardTitle') + '</h2><div class="sub">' + (d.mode === 'final' ? t('boardSubFinal') : t('boardSubLive')) + '</div></div></div>';
    if (!d.leaderboard.length) {
      return '<section>' + head + '<div class="waiting"><img src="' + window.LOGOS.navy + '" alt=""><h3>' + (d.mode === 'final' ? t('waitingFinal') : t('waitingTitle')) + '</h3>' +
        (d.mode === 'final' ? '' : '<div class="sub">' + t('waitingSub') + '</div>') + '</div></section>';
    }
    var cells = '';
    for (var i = 1; i <= 3; i++) {
      var r = d.leaderboard[i - 1];
      var medal = '<div class="medal-wrap">' + (i === 1 ? '<div class="crown" aria-hidden="true">👑</div>' : '') + '<div class="medal">' + i + '</div></div>';
      if (!r) { cells += '<div class="place r' + i + ' empty">' + medal + '<div class="rname">' + t('rankEmpty') + '</div><div class="rstat">&nbsp;</div></div>'; continue; }
      var stat = r.full
        ? '<b class="num">100%</b><br>' + t('reached') + ' <span class="num">' + fmtDate(r.lastCompletion, true) + '</span>'
        : '<b class="num">' + fmtPct(r.pct) + '</b>' + (r.lastCompletion ? '<br>' + t('lastAt') + ' <span class="num">' + fmtDate(r.lastCompletion, true) + '</span>' : '');
      cells += '<div class="place r' + i + '">' + medal + '<div class="rname">' + esc(r.name) + '</div><div class="rstat">' + stat + '</div></div>';
    }
    return '<section>' + head + '<div class="podium">' + cells + '</div></section>';
  }

  function renderChart(d) {
    var list = d.restaurants.slice();
    if (chartSort === 'pct') list.sort(function (a, b) { return b.pct - a.pct || (a.lastCompletion || Infinity) - (b.lastCompletion || Infinity) || a.name.localeCompare(b.name); });
    else list.sort(function (a, b) { return shortName(a.name).localeCompare(shortName(b.name), 'vi'); });
    var rows = list.map(function (r) {
      return '<div class="bar-row" data-i="' + d.restaurants.indexOf(r) + '">' +
        '<div class="bar-name" title="' + esc(r.name) + '">' + esc(shortName(r.name)) + '</div>' +
        '<div class="bar-track"><div class="bar-fill' + (r.full ? ' full' : '') + '" style="width:' + Math.min(100, r.pct) + '%"></div></div>' +
        '<div class="bar-val num"><b>' + (r.full ? '✓ ' : '') + fmtPct(r.pct) + '</b></div></div>';
    }).join('');
    return '<section><div class="sec-head"><div><h2>' + t('chartTitle') + '</h2><div class="sub">' + t('chartSub') + '</div></div>' +
      '<div class="seg" id="sortSeg"><button type="button" data-s="pct" class="' + (chartSort === 'pct' ? 'on' : '') + '">' + t('sortPct') + '</button><button type="button" data-s="name" class="' + (chartSort === 'name' ? 'on' : '') + '">' + t('sortName') + '</button></div></div>' +
      '<div class="legend"><span><i style="background:var(--teal)"></i>' + t('legendFull') + '</span><span><i style="background:var(--blue)"></i>' + t('legendPart') + '</span></div>' +
      '<div class="bars" id="bars">' + rows + '</div></section>';
  }

  function bindChart() {
    var tip = document.getElementById('tip');
    document.querySelectorAll('#sortSeg button').forEach(function (b) {
      b.onclick = function () { chartSort = b.dataset.s; render(); };
    });
    document.querySelectorAll('.bar-row').forEach(function (row) {
      row.onmousemove = function (ev) {
        var r = DATA.restaurants[+row.dataset.i];
        // Số partner hoàn thành/tổng chỉ admin nhận được từ server
        tip.innerHTML = '<b>' + esc(r.name) + '</b>' + (r.area ? ' · ' + esc(r.area) : '') + '<br>' + fmtPct(r.pct) +
          (hasCounts(r) ? ' · ' + r.completed + '/' + r.total + ' ' + t('partners') + ' ' + t('completedOf') : '') +
          '<br>' + (r.lastCompletion ? t('lastAt') + ': ' + fmtDate(r.lastCompletion, true) : t('noLast'));
        tip.style.display = 'block';
        var x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
        tip.style.left = x + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
      };
      row.onmouseleave = function () { tip.style.display = 'none'; };
    });
  }

  /* ---------- Tiến độ chi tiết (chọn nhiều nhà hàng / cả Area) ---------- */
  function areaGroups() {
    var groups = [], idx = {};
    DATA.detailRestaurants.forEach(function (n) {
      var r = restByName(n);
      var a = (r && r.area) || t('noArea');
      if (!idx.hasOwnProperty(a)) { idx[a] = groups.length; groups.push({ area: a, names: [] }); }
      groups[idx[a]].names.push(n);
    });
    var order = ['north', 'south', 'central'];
    return groups.sort(function (x, y) {
      var ix = order.indexOf(x.area.toLowerCase()), iy = order.indexOf(y.area.toLowerCase());
      return (ix === -1 ? 99 : ix) - (iy === -1 ? 99 : iy) || x.area.localeCompare(y.area);
    });
  }

  function selLabel() {
    var sel = detailState.selected;
    if (!sel.length) return t('choose');
    if (sel.length === 1) return esc(sel[0]);
    if (sel.length === DATA.detailRestaurants.length) return t('allSelected') + ' (' + sel.length + ')';
    var full = areaGroups().filter(function (g) { return g.names.every(function (n) { return sel.indexOf(n) !== -1; }); });
    if (full.length && full.reduce(function (s, g) { return s + g.names.length; }, 0) === sel.length) {
      return full.map(function (g) { return esc(g.area); }).join(', ') + ' (' + sel.length + ')';
    }
    return sel.length + ' ' + t('nSelected');
  }

  function renderDetailShell(d) {
    var head = '<div class="sec-head"><div><h2>' + t('detailTitle') + '</h2><div class="sub">' + t('detailSub') + '</div></div></div>';
    if (!d.detailRestaurants.length) return '<section>' + head + '<div class="locked">🔒 ' + t('locked') + '</div></section>';
    detailState.selected = detailState.selected.filter(function (n) { return d.detailRestaurants.indexOf(n) !== -1; });
    if (!detailState.selected.length && d.detailRestaurants.length === 1) detailState.selected = [d.detailRestaurants[0]];

    var multi = d.detailRestaurants.length > 1;
    var groups = areaGroups();
    var list = groups.map(function (g) {
      return '<div class="ms-group">' +
        (groups.length > 1 || g.names.length > 1 ? '<label class="ms-area"><input type="checkbox" data-area="' + esc(g.area) + '"> ' + esc(g.area) + ' <span class="sub">(' + g.names.length + ')</span></label>' : '') +
        g.names.map(function (n) {
          return '<label class="ms-item" data-name="' + esc(n.toLowerCase()) + '"><input type="checkbox" data-rest="' + esc(n) + '"' + (detailState.selected.indexOf(n) !== -1 ? ' checked' : '') + '> ' + esc(n) + '</label>';
        }).join('') + '</div>';
    }).join('');
    var picker = multi
      ? '<details class="ms" id="ms"><summary id="msLabel">' + selLabel() + '</summary><div class="ms-panel">' +
        '<input type="search" id="msQ" placeholder="' + t('findRest') + '">' +
        '<div class="ms-actions"><button type="button" id="msAll">' + t('selectAll') + '</button><button type="button" id="msNone">' + t('clearAll') + '</button></div>' +
        '<div class="ms-list">' + list + '</div></div></details>'
      : '<div class="ms-single">' + esc(d.detailRestaurants[0]) + '</div>';

    var cOpts = '<option value="">' + t('allCourses') + '</option>' + d.courses.map(function (c) {
      return '<option' + (c.id === detailState.course ? ' selected' : '') + ' value="' + esc(c.id) + '">' + esc(c.name) + '</option>';
    }).join('');
    var sOpts = [['', t('all')], ['done', t('stDone')], ['not', t('stNot')]].map(function (o) {
      return '<option' + (o[0] === detailState.status ? ' selected' : '') + ' value="' + o[0] + '">' + o[1] + '</option>';
    }).join('');
    return '<section>' + head +
      '<div class="filters">' +
      '<div class="fld f-wide">' + (multi ? t('restPick') : t('restaurant')) + picker + '</div>' +
      (d.courses.length > 1 ? '<label>' + t('course') + '<select id="fCourse">' + cOpts + '</select></label>' : '') +
      '<label>' + t('status') + '<select id="fStatus">' + sOpts + '</select></label>' +
      '<label>' + t('search') + '<input type="search" id="fQ" value="' + esc(detailState.q) + '"></label>' +
      '</div><div id="detailBody"></div></section>';
  }

  function syncPicker() {
    var sel = detailState.selected;
    document.querySelectorAll('#ms [data-rest]').forEach(function (cb) { cb.checked = sel.indexOf(cb.dataset.rest) !== -1; });
    areaGroups().forEach(function (g) {
      var cb = document.querySelector('#ms [data-area="' + g.area.replace(/"/g, '\\"') + '"]');
      if (!cb) return;
      var n = g.names.filter(function (x) { return sel.indexOf(x) !== -1; }).length;
      cb.checked = n === g.names.length;
      cb.indeterminate = n > 0 && n < g.names.length;
    });
    var lbl = document.getElementById('msLabel');
    if (lbl) lbl.innerHTML = selLabel();
  }

  var loadTimer = null;
  function selectionChanged() {
    syncPicker();
    clearTimeout(loadTimer);
    loadTimer = setTimeout(loadDetail, 350);
  }

  function bindDetail() {
    if (!document.getElementById('detailBody')) return;
    var ms = document.getElementById('ms');
    if (ms) {
      ms.addEventListener('change', function (e) {
        var el = e.target;
        if (el.dataset.rest) {
          var i = detailState.selected.indexOf(el.dataset.rest);
          if (el.checked && i === -1) detailState.selected.push(el.dataset.rest);
          if (!el.checked && i !== -1) detailState.selected.splice(i, 1);
        } else if (el.dataset.area) {
          var g = areaGroups().filter(function (x) { return x.area === el.dataset.area; })[0];
          g.names.forEach(function (n) {
            var j = detailState.selected.indexOf(n);
            if (el.checked && j === -1) detailState.selected.push(n);
            if (!el.checked && j !== -1) detailState.selected.splice(j, 1);
          });
        } else return;
        selectionChanged();
      });
      document.getElementById('msAll').onclick = function () { detailState.selected = DATA.detailRestaurants.slice(); selectionChanged(); };
      document.getElementById('msNone').onclick = function () { detailState.selected = []; selectionChanged(); };
      document.getElementById('msQ').oninput = function (e) {
        var q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('#ms .ms-item').forEach(function (it) { it.style.display = !q || it.dataset.name.indexOf(q) !== -1 ? '' : 'none'; });
      };
      syncPicker();
    }
    var c = document.getElementById('fCourse');
    if (c) c.onchange = function () { detailState.course = c.value; drawDetail(); };
    document.getElementById('fStatus').onchange = function (e) { detailState.status = e.target.value; drawDetail(); };
    document.getElementById('fQ').oninput = function (e) { detailState.q = e.target.value; drawDetail(); };
    loadDetail();
  }

  function selectedNames() {
    // Giữ thứ tự theo danh sách nhà hàng
    return DATA.detailRestaurants.filter(function (n) { return detailState.selected.indexOf(n) !== -1; });
  }

  function loadDetail() {
    var names = selectedNames();
    var body = document.getElementById('detailBody');
    if (!body) return;
    if (!names.length) { body.innerHTML = '<div class="locked">' + t('pickHint') + '</div>'; return; }
    var missing = names.filter(function (n) { return !detailCache[n]; });
    if (!missing.length) { drawDetail(); return; }
    body.innerHTML = '<div class="sub">' + t('loading') + '</div>';
    google.script.run
      .withSuccessHandler(function (map) {
        Object.keys(map).forEach(function (n) { detailCache[n] = map[n]; });
        missing.forEach(function (n) { if (!detailCache[n]) detailCache[n] = []; });
        drawDetail();
      })
      .withFailureHandler(function (err) { body.innerHTML = '<div class="locked">' + (String(err && err.message).indexOf('NO_ACCESS') !== -1 ? t('noAccess') : t('error')) + '</div>'; })
      .getDetails(missing);
  }

  function drawDetail() {
    var body = document.getElementById('detailBody');
    var names = selectedNames();
    if (!body || !names.length || names.some(function (n) { return !detailCache[n]; })) return;
    var multiRest = names.length > 1;
    var rows = [];
    names.forEach(function (n) { detailCache[n].forEach(function (x) { rows.push(Object.assign({ rest: n }, x)); }); });

    // Thống kê tính trên dữ liệu chi tiết người xem đã có quyền xem
    var people = {}, done = {}, last = null;
    rows.forEach(function (x) {
      people[x.code] = people[x.code] === undefined ? true : people[x.code];
      if (!x.completed) people[x.code] = false;
    });
    var nPeople = Object.keys(people).length;
    var nDone = Object.keys(people).filter(function (k) { return people[k]; }).length;
    rows.forEach(function (x) { if (people[x.code] && x.date && (last === null || x.date > last)) last = x.date; });

    var q = detailState.q.trim().toLowerCase();
    var multiCourse = DATA.courses.length > 1;
    var list = rows.filter(function (r) {
      if (detailState.course && r.courseId !== detailState.course) return false;
      if (detailState.status === 'done' && !r.completed) return false;
      if (detailState.status === 'not' && r.completed) return false;
      if (q && (r.code + ' ' + r.name).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var chips = '<div class="chips"><span class="chip num"><b>' + fmtPct(nPeople ? nDone / nPeople * 100 : 0) + '</b> · ' + nDone + '/' + nPeople + ' ' + t('partners') + ' ' + t('completedOf') + '</span>' +
      '<span class="chip">' + (last ? t('lastAt') + ': <b class="num">' + fmtDate(last, true) + '</b>' : t('noLast')) + '</span>' +
      '<span class="chip num">' + list.length + ' ' + t('rows') + '</span></div>';
    if (!list.length) { body.innerHTML = chips + '<div class="locked">' + t('noRows') + '</div>'; return; }
    var trs = list.map(function (x) {
      var cls = x.completed ? 'done' : (/^\d/.test(x.status) ? 'prog' : (x.status === 'Not enrolled' ? 'none' : ''));
      return '<tr><td class="num">' + esc(x.code) + '</td><td>' + esc(x.name) + '</td>' + (multiRest ? '<td>' + esc(x.rest) + '</td>' : '') + '<td>' + esc(x.func) + '</td>' +
        (multiCourse ? '<td>' + esc(courseName(x.courseId)) + '</td>' : '') +
        '<td><span class="st ' + cls + '">' + esc(stLabel(x.status)) + '</span></td><td class="num">' + (x.completed ? fmtDate(x.date, true) : '') + '</td></tr>';
    }).join('');
    body.innerHTML = chips + '<div class="table-wrap"><table><thead><tr><th>' + t('cCode') + '</th><th>' + t('cName') + '</th>' + (multiRest ? '<th>' + t('cRest') + '</th>' : '') + '<th>' + t('cFunc') + '</th>' +
      (multiCourse ? '<th>' + t('cCourse') + '</th>' : '') + '<th>' + t('cStatus') + '</th><th>' + t('cDate') + '</th></tr></thead><tbody>' + trs + '</tbody></table></div>';
  }

  /* ---------- Admin ---------- */
  function warnBlock(title, count, inner) {
    return '<details class="warn-box"><summary><span class="warn-count num">' + count + '</span> ' + title + '</summary><div class="warn-list">' + inner +
      (count > 300 ? '<div class="sub">' + t('wShown') + '</div>' : '') + '</div></details>';
  }

  function renderAdmin(d) {
    var a = d.admin || {};
    var w = a.warnings || {};
    var blocks = '';
    if (w.unknownRestaurant) {
      blocks += warnBlock(t('wUnknown'), w.unknownRestaurant, '<div class="table-wrap"><table><thead><tr><th>' + t('cCode') + '</th><th>' + t('wRestVal') + '</th></tr></thead><tbody>' +
        (w.unknownRestaurantList || []).map(function (x) { return '<tr><td class="num">' + esc(x.code) + '</td><td>' + (x.restaurant ? esc(x.restaurant) : '<i>' + t('blank') + '</i>') + '</td></tr>'; }).join('') + '</tbody></table></div>');
    }
    if (w.progressNotInList) {
      blocks += warnBlock(t('wNotIn'), w.progressNotInList, '<div class="code-list num">' + (w.progressNotInListList || []).map(esc).join(', ') + '</div>');
    }
    if (w.noAreaRestaurants && w.noAreaRestaurants.length) {
      blocks += warnBlock(t('wNoArea'), w.noAreaRestaurants.length, '<div class="code-list">' + w.noAreaRestaurants.map(esc).join(', ') + '</div>');
    }
    if (w.duplicateEmployee) blocks += '<div class="sub">⚠️ ' + t('wDup') + ': <b>' + w.duplicateEmployee + '</b></div>';
    return '<section class="admin"><div class="sec-head"><div><h2>⚙️ ' + t('adminTitle') + '</h2><div class="sub">' + t('adminSub') + '</div></div></div>' +
      '<div class="admin-actions">' +
      '<button class="btn" data-act="adminPullTalentLMS" data-c="cPull">' + t('aPull') + '</button>' +
      '<button class="btn" data-act="adminSyncFromSheet" data-c="cSync">' + t('aSync') + '</button>' +
      (d.frozen
        ? '<button class="btn primary" data-act="adminUnfreeze" data-c="cUnfreeze">🔓 ' + t('aUnfreeze') + '</button>'
        : '<button class="btn danger" data-act="adminFreeze" data-c="cFreeze">🔒 ' + t('aFreeze') + '</button>') +
      '</div><div class="admin-info">' +
      '<div>' + t('lastPull') + ': <b class="num">' + (a.lastPullAt ? fmtDate(a.lastPullAt, true) + ' (' + a.lastPullRows + ' ' + t('rows') + ')' : '—') + '</b></div>' +
      (a.lastError ? '<div class="err">' + t('lastErr') + ': ' + esc(a.lastError) + '</div>' : '') +
      '<div style="margin-top:8px"><b>' + t('warn') + '</b></div>' + (blocks || '<div>' + t('noWarn') + '</div>') +
      '</div></section>';
  }

  function bindAdmin() {
    document.querySelectorAll('[data-act]').forEach(function (btn) {
      btn.onclick = function () {
        if (!confirm(t(btn.dataset.c))) return;
        document.querySelectorAll('[data-act]').forEach(function (b) { b.disabled = true; });
        google.script.run
          .withSuccessHandler(function () { detailCache = {}; alert(t('done')); load(); })
          .withFailureHandler(function (err) { alert(t('error') + ': ' + (err && err.message)); load(); })[btn.dataset.act]();
      };
    });
  }

  function load() {
    google.script.run
      .withSuccessHandler(function (d) { DATA = d; render(); })
      .withFailureHandler(function (err) {
        document.getElementById('app').innerHTML = '<div class="loading err">' + t('error') + ': ' + esc(err && err.message) + '</div>';
      })
      .getDashboardData();
  }

  // Bấm ra ngoài thì đóng danh sách chọn nhà hàng
  document.addEventListener('click', function (e) {
    var ms = document.getElementById('ms');
    if (ms && ms.open && !ms.contains(e.target)) ms.open = false;
  });
  document.getElementById('logo').src = window.LOGOS.light;
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.onclick = function () {
      lang = b.dataset.lang;
      try { localStorage.setItem('lc_lang', lang); } catch (e) {}
      render();
    };
  });
  render();
  load();
</script>
